<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="vram-thrash-diaries logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0d0620"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <rect width="640" height="200" rx="18" fill="url(#bg)"/>

  <!-- GPU chip -->
  <g transform="translate(36,40)">
    <rect x="0" y="0" width="120" height="120" rx="10" fill="url(#chip)"/>
    <rect x="16" y="16" width="88" height="88" rx="6" fill="#0d0620" opacity="0.55"/>
    <!-- pins -->
    <g stroke="#c4b5fd" stroke-width="3">
      <line x1="-10" y1="20" x2="0" y2="20"/>
      <line x1="-10" y1="44" x2="0" y2="44"/>
      <line x1="-10" y1="68" x2="0" y2="68"/>
      <line x1="-10" y1="92" x2="0" y2="92"/>
      <line x1="120" y1="20" x2="130" y2="20"/>
      <line x1="120" y1="44" x2="130" y2="44"/>
      <line x1="120" y1="68" x2="130" y2="68"/>
      <line x1="120" y1="92" x2="130" y2="92"/>
      <line x1="20" y1="-10" x2="20" y2="0"/>
      <line x1="44" y1="-10" x2="44" y2="0"/>
      <line x1="68" y1="-10" x2="68" y2="0"/>
      <line x1="92" y1="-10" x2="92" y2="0"/>
      <line x1="20" y1="120" x2="20" y2="130"/>
      <line x1="44" y1="120" x2="44" y2="130"/>
      <line x1="68" y1="120" x2="68" y2="130"/>
      <line x1="92" y1="120" x2="92" y2="130"/>
    </g>
    <!-- little nodes being juggled -->
    <circle cx="40" cy="40" r="9" fill="#facc15"/>
    <circle cx="80" cy="40" r="9" fill="#f472b6" opacity="0.45"/>
    <circle cx="60" cy="72" r="9" fill="#34d399"/>
  </g>

  <!-- eviction arrows -->
  <g stroke="url(#pulse)" stroke-width="3" fill="none" opacity="0.9">
    <path d="M 190 60 Q 230 20 270 60" marker-end="url(#arrow)"/>
    <path d="M 270 140 Q 230 180 190 140" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#facc15"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="300" y="95" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#f5f3ff">vram-thrash-diaries</text>
  <text x="300" y="122" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c4b5fd">a local-LLM infra field journal</text>

  <!-- tiny status row -->
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#8b7bd8">
    <text x="300" y="150">$ ollama ps</text>
    <text x="300" y="168">NAME                     PROCESSOR       UNTIL</text>
    <text x="300" y="184" fill="#34d399">chat-model               95% GPU          4m</text>
  </g>
</svg>
